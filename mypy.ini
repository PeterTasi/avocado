[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = False

[mypy-tests.*]
ignore_errors = True

[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True
