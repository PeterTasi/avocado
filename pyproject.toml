[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "SIM102",
    "SIM108",
]

[lint.isort]
known-first-party = ["adaptlearn"]
force-single-line = false

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T20"]
"webapp/main.py" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
