databases:
  - name: adaptlearn-db
    plan: free
    databaseName: adaptlearn
    user: adaptlearn

services:
  - type: web
    name: adaptlearn-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptlearn-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # fill in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://YOUR_USERNAME.github.io
      - key: API_ACCESS_KEY
        sync: false          # optional: protect the API
      - key: PYTHON_VERSION
        value: "3.11"
